name: Temporary TL-U10 lockfile refresh

# Temporary branch-scoped maintenance job. Remove after the lockfile is committed.
on:
  push:
    branches:
      - feat/tl-u10-cli-host-security
    paths:
      - .github/workflows/tl-u10-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Generate exact lockfile for reviewed AST dependencies
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Commit changed dependency resolution to same branch
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git -c commit.gpgsign=false commit --signoff -m 'chore(TL-U10): lock audited Markdown and MDX syntax parsers'
          git push origin HEAD:refs/heads/feat/tl-u10-cli-host-security
