name: Throughline CI

# Quality only: no publication or deployment.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: throughline-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Compiler, browser and distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source head for reproducible TL-U18 results
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify actual checked-out source matches the recorded evidence SHA
        env:
          THL_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$THL_SOURCE_SHA"
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # The committed lockfile is the authoritative dependency resolution.
      - name: Install standalone dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify lockfile remains unchanged
        run: git diff --exit-code -- pnpm-lock.yaml
      - name: Parse manual publish workflow YAML
        run: ruby -e 'require "yaml"; YAML.parse_file(".github/workflows/publish.yml")'
      - name: Audit public-source boundaries and dependency licenses
        run: pnpm audit:source
      - name: Typecheck
        run: pnpm typecheck
      - name: Typecheck local preview
        run: pnpm preview:typecheck
      - name: Bundle local preview
        run: pnpm preview:build
      - name: TL-U19 offline release tooling and negative authorization checks
        run: pnpm test:release-tooling
      - name: Compiler, release performance and hostile-input tests
        env:
          THL_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm test:run
      - name: Verify exact-source TL-U18 security and performance evidence
        env:
          THL_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/verify-release-evidence.mjs
      - name: Upload checked TL-U18 measured evidence
        uses: actions/upload-artifact@v7
        with:
          name: throughline-v2-quality-${{ github.run_id }}
          path: |
            .release-evidence/v2-performance.json
            .release-evidence/v2-security.json
          if-no-files-found: error
          retention-days: 30
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm test:browser:run
      - name: Record verified Chromium browser evidence
        env:
          THL_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/record-browser-evidence.mjs chromium
      - name: Upload checked Chromium browser evidence
        uses: actions/upload-artifact@v7
        with:
          name: throughline-v2-chromium-${{ github.run_id }}
          path: .release-evidence/v2-browser-chromium.json
          if-no-files-found: error
          retention-days: 30
      - name: Build distributable
        run: pnpm build
      - name: Check runtime and peer dependency notices
        run: pnpm audit:licenses
      - name: Inspect packed archive in external consumers
        run: pnpm audit:pack
      - name: Validate packed Vite browser hydration
        run: pnpm audit:browser
      - name: Validate framework integration consumers
        run: pnpm audit:frameworks
      - name: Validate Markdown host consumers
        run: pnpm audit:markdown-hosts

      # The exact-head job above provides artifact hashes and benchmark evidence.
      # A PR's required CI must ALSO test the *proposed merge result*, because
      # the base branch may have changed. Keep this inside the same required
      # job, so a green check cannot mean "only the isolated head passed".
      - name: Check out proposed PR merge result for integration verification
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Verify proposed merge includes the exact reviewed PR head
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^1)" != "$EXPECTED_HEAD"
      - name: Install frozen dependencies for proposed merge result
        if: github.event_name == 'pull_request'
        run: |
          pnpm install --frozen-lockfile
          git diff --exit-code -- pnpm-lock.yaml
      - name: Re-run complete quality, browser, archive and host suite on proposed merge result
        if: github.event_name == 'pull_request'
        env:
          THL_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; YAML.parse_file(".github/workflows/publish.yml")'
          pnpm audit:source
          pnpm typecheck
          pnpm preview:typecheck
          pnpm preview:build
          pnpm test:release-tooling
          pnpm test:run
          node scripts/verify-release-evidence.mjs
          pnpm test:browser:run
          pnpm build
          pnpm audit:licenses
          pnpm audit:pack
          pnpm audit:browser
          pnpm audit:frameworks
          pnpm audit:markdown-hosts
