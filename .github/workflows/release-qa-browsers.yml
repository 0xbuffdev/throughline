name: Throughline release QA browsers

# Additional, read-only release-candidate verification. The regular CI
# retains Chromium and the distributable/consumer checks.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: throughline-release-browser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-browser:
    name: Browser regressions (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify lockfile unchanged
        run: git diff --exit-code -- pnpm-lock.yaml
      - name: Install tested browser and system dependencies
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Run the complete browser regression suite
        env:
          THROUGHLINE_QA_BROWSER: ${{ matrix.browser }}
        run: pnpm test:browser:run
