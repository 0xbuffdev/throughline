name: Throughline Release Artifact Preview

# This workflow creates a review artifact. It NEVER publishes to npm,
# grants OIDC credentials, creates tags, or changes repository visibility.
on:
  pull_request:
    paths:
      - '.github/workflows/release-preview.yml'
      - 'RELEASING.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: throughline-release-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build and verify read-only release preview
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v6
      - name: Set up pinned pnpm
        uses: pnpm/action-setup@v6
      - name: Use Node.js 24 without release caching
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enforce preview-only unreleased package state
        run: |
          node --input-type=module - <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          assert.equal(pkg.name, "@0xbuff/throughline");
          assert.equal(pkg.version, "0.0.0");
          assert.equal(pkg.private, true);
          assert.equal(pkg.license, "Apache-2.0");
          console.log("Unreleased private package: rehearsal only.");
          NODE
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Check source and declared licenses
        run: pnpm audit:source
      - name: Typecheck
        run: pnpm typecheck
      - name: Run compiler unit tests
        run: pnpm test:run
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser tests
        run: pnpm test:browser:run
      - name: Produce tsdown distributable
        run: pnpm build
      - name: Check packed Node and React SSR consumers
        run: pnpm audit:pack
      - name: Check packed Vite browser hydration
        run: pnpm audit:browser
      - name: Build review-only tarball and checksums
        shell: bash
        run: |
          pnpm pack --out ./throughline-preview.tgz
          sha256sum ./throughline-preview.tgz > SHA256SUMS
          printf 'source_commit=%s\npackage=@0xbuff/throughline\npackage_version=0.0.0\nprivate=true\npublication=not_authorized\n' "${GITHUB_SHA}" > ARTIFACT_INFO.txt
          cat SHA256SUMS
      - name: Upload private review artifact
        uses: actions/upload-artifact@v4
        with:
          name: throughline-preview-${{ github.sha }}
          path: |
            throughline-preview.tgz
            SHA256SUMS
            ARTIFACT_INFO.txt
          if-no-files-found: error
          retention-days: 7
