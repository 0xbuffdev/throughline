name: Throughline npm release (staged with provenance)

# Manual only: staging is not publication; final npm 2FA approval is separate.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "GitHub-verified signed release tag"
        type: string
        required: true
        default: v0.0.2
      confirmation:
        description: "Enter STAGE-<tag>, for example STAGE-v0.0.2"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: throughline-npm-stage
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag and build release archive
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Require explicit manual release request
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || exit 1
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Use a signed vX.Y.Z tag"; exit 1; }
          [[ "$CONFIRMATION" == "STAGE-$RELEASE_TAG" ]] || { echo "Type STAGE-$RELEASE_TAG to proceed"; exit 1; }

      - name: Checkout exact tag without persistent credentials
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify signed annotated tag on main using GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          [[ "$(jq -r '.object.type' <<< "$tag_ref")" == "tag" ]] || { echo "Signed annotated tag required"; exit 1; }
          tag_sha="$(jq -er '.object.sha' <<< "$tag_ref")"
          tag_data="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha")"
          [[ "$(jq -r '.tag' <<< "$tag_data")" == "$RELEASE_TAG" ]] || exit 1
          [[ "$(jq -r '.verification.verified' <<< "$tag_data")" == "true" ]] || { echo "Tag not GitHub Verified"; exit 1; }
          [[ "$(jq -r '.object.type' <<< "$tag_data")" == "commit" ]] || exit 1
          [[ "$(jq -r '.object.sha' <<< "$tag_data")" == "$(git rev-parse HEAD)" ]] || exit 1
          git fetch origin main --no-tags
          git merge-base --is-ancestor HEAD origin/main || { echo "Tagged commit is not on main"; exit 1; }
          git cat-file -e HEAD:.github/workflows/publish.yml

      - uses: pnpm/action-setup@v6
        name: Set up pinned pnpm
      - uses: actions/setup-node@v6
        name: Set up Node 24 without release caching
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate package, version, license and export map
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          assert.equal(pkg.name, "@0xbuff/throughline");
          assert.match(pkg.version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/);
          assert.equal(process.env.RELEASE_TAG, `v${pkg.version}`, "Signed tag must match package version");
          assert.equal(pkg.private, false);
          assert.equal(pkg.publishConfig?.access, "public");
          assert.equal(pkg.license, "Apache-2.0");
          assert.equal(pkg.homepage, "https://docs.0xbuff.com/docs/throughline");
          assert.equal(pkg.repository?.url, "git+https://github.com/0xbuffdev/throughline.git");
          assert.deepEqual(Object.keys(pkg.exports).sort(),
            [".", "./react", "./examples", "./styles/throughline.css"].sort());
          NODE

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Source and license boundary audit
        run: pnpm audit:source
      - name: Typecheck
        run: pnpm typecheck
      - name: Compiler tests
        run: pnpm test:run
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm test:browser:run
      - name: Build typed ESM distributable
        run: pnpm build
      - name: Verify installed dependency licenses
        run: pnpm audit:licenses
      - name: Verify packed Node, TypeScript and React SSR consumers
        run: pnpm audit:pack
      - name: Verify packed Vite/React browser hydration
        run: pnpm audit:browser

      - name: Pack reviewed tarball and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          pnpm pack --out release-artifacts/throughline.tgz
          (cd release-artifacts && sha256sum throughline.tgz > SHA256SUMS)
          git rev-parse HEAD > release-artifacts/RELEASE_COMMIT
          (cd release-artifacts && sha256sum --check SHA256SUMS)

      - name: Upload immutable release review artifact
        uses: actions/upload-artifact@v7
        with:
          name: throughline-release-${{ github.run_id }}
          path: |
            release-artifacts/throughline.tgz
            release-artifacts/SHA256SUMS
            release-artifacts/RELEASE_COMMIT
          if-no-files-found: error
          retention-days: 7

  stage:
    name: Stage reviewed tarball using GitHub OIDC provenance
    needs: verify
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout same release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: throughline-release-${{ github.run_id }}
          path: release-artifacts

      - name: Recheck checksum, release commit and archive manifest
        shell: bash
        run: |
          set -euo pipefail
          (cd release-artifacts && sha256sum --check SHA256SUMS)
          [[ "$(cat release-artifacts/RELEASE_COMMIT)" == "$(git rev-parse HEAD)" ]] || { echo "Tag changed since build"; exit 1; }
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { execFileSync } from "node:child_process";
          import { readFileSync } from "node:fs";
          const pkg = JSON.parse(execFileSync("tar", [
            "-xOf", "release-artifacts/throughline.tgz", "package/package.json"
          ], { encoding: "utf8" }));
          assert.equal(pkg.name, "@0xbuff/throughline");
          const source = JSON.parse(readFileSync("package.json", "utf8"));
          assert.equal(pkg.version, source.version, "Archive version must match signed tag source");
          assert.equal(pkg.private, false);
          assert.equal(pkg.publishConfig?.access, "public");
          assert.equal(pkg.license, "Apache-2.0");
          NODE

      # Avoid setup-node's registry-url input for tokenless OIDC:
      # it creates an .npmrc authToken placeholder and NODE_AUTH_TOKEN,
      # causing npm to attempt classic token authentication (E401).
      # The staging command itself explicitly selects registry.npmjs.org.
      - name: Set up Node 24 without token-based npm registry authentication
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install compatible npm CLI
        run: |
          npm install --global npm@11.21.2
          npm --version

      - name: Confirm tokenless OIDC authentication path
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]] || { echo "GitHub OIDC unavailable"; exit 1; }
          [[ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]] || { echo "GitHub OIDC token request unavailable"; exit 1; }
          [[ -z "${NODE_AUTH_TOKEN:-}" ]] || { echo "Unexpected traditional npm token; OIDC only"; exit 1; }
          userconfig="$(npm config get userconfig)"
          if [[ -f "$userconfig" ]] && grep -Eq '(^|/):_authToken[[:space:]]*=' "$userconfig"; then
            echo "An npm authToken entry would prevent tokenless OIDC"
            exit 1
          fi

      - name: Stage only with provenance (never direct-publish)
        shell: bash
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail
          npm stage publish ./release-artifacts/throughline.tgz --access public --provenance --registry=https://registry.npmjs.org/

      - name: State remaining npm manual approval
        shell: bash
        run: |
          {
            pkg_version="$(node -p "require('./package.json').version")"
            echo "### @0xbuff/throughline@${pkg_version} submitted to npm staging"
            echo "This is NOT a published version. Review the staged package and"
            echo "approve separately with npm 2FA on npmjs.com or through npm CLI."
            echo "Source: $(git rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"
