name: Throughline npm release (staged with provenance)

# Two manual dispatches: prepare an immutable candidate, then separately authorize staging.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Prepare candidate or authorize staging of previously tested bytes"
        type: choice
        options: [prepare, stage]
        required: true
        default: prepare
      tag:
        description: "Prospective release tag (must be signed and verified for stage)"
        type: string
        required: true
      confirmation:
        description: "Enter PREPARE-<tag> or STAGE-<tag> matching mode"
        type: string
        required: true
      candidate_run:
        description: "Successful prepare run ID (stage only)"
        type: string
        required: false
      candidate_attempt:
        description: "Successful prepare run attempt (stage only)"
        type: string
        required: false
      review:
        description: "Exact-candidate review JSON; see docs/release-quality.md (stage only)"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: throughline-npm-stage
  cancel-in-progress: false

jobs:
  verify:
    name: Prepare and test immutable release candidate
    if: github.ref == 'refs/heads/main' && inputs.mode == 'prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Require explicit manual release request
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || exit 1
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Use a prospective vX.Y.Z tag"; exit 1; }
          [[ "$CONFIRMATION" == "PREPARE-$RELEASE_TAG" ]] || { echo "Type PREPARE-$RELEASE_TAG to proceed"; exit 1; }

      - name: Checkout exact candidate without persistent credentials
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind release evidence to the exact checked-out candidate commit
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "THL_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6
        name: Set up pinned pnpm
      - uses: actions/setup-node@v6
        name: Set up Node 24 without release caching
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate package, version, license and export map
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          assert.equal(pkg.name, "@0xbuff/throughline");
          assert.match(pkg.version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/);
          assert.equal(process.env.RELEASE_TAG, `v${pkg.version}`, "Prospective tag must match package version");
          assert.equal(pkg.private, false);
          assert.equal(pkg.publishConfig?.access, "public");
          assert.equal(pkg.license, "Apache-2.0");
          assert.equal(pkg.homepage, "https://docs.0xbuff.com/docs/throughline");
          assert.equal(pkg.repository?.url, "git+https://github.com/0xbuffdev/throughline.git");
          assert.deepEqual(Object.keys(pkg.exports).sort(),
            [".", "./remark", "./react", "./examples", "./node", "./styles/throughline.css"].sort());
          assert.equal(pkg.bin?.thl, "./dist/cli/main.js");
          NODE

      - name: Require integrated production audit before candidate preparation
        run: test -f scripts/audit-mermaid-production.mjs || { echo "U29 production packed audit is not implemented"; exit 1; }
      - name: Install frozen dependencies
        run: |
          pnpm install --frozen-lockfile
          git diff --exit-code -- pnpm-lock.yaml
      - name: Source and license boundary audit
        run: pnpm audit:source
      - name: Typecheck
        run: pnpm typecheck
      - name: Typecheck and bundle local playground
        run: |
          pnpm preview:typecheck
          pnpm preview:build
      - name: Compiler, release performance and hostile-input tests
        run: pnpm test:run
      - name: Verify exact-candidate quality evidence
        run: |
          node scripts/verify-release-evidence.mjs
          node scripts/test-release-evidence.mjs
          node --test scripts/release-candidate-gate.test.mjs
      - name: Upload validated release-quality evidence separately from the staged package
        uses: actions/upload-artifact@v7
        with:
          name: throughline-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .release-evidence/v2-performance.json
            .release-evidence/v2-security.json
          if-no-files-found: error
          retention-days: 30

      - name: Install all mandatory browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Run and record all three exact-source browser suites
        shell: bash
        run: |
          set -euo pipefail
          for browser in chromium firefox webkit; do
            THROUGHLINE_QA_BROWSER="$browser" pnpm test:browser:run
            node scripts/record-browser-evidence.mjs "$browser"
          done
      - name: Upload verified browser evidence
        uses: actions/upload-artifact@v7
        with:
          name: throughline-release-browsers-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release-evidence/v2-browser-*.json
          if-no-files-found: error
          retention-days: 30
      - name: Build typed ESM distributable
        run: pnpm build
      - name: Verify installed dependency licenses
        run: pnpm audit:licenses

      - name: Pack reviewed tarball and checksum once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          pnpm pack --out release-artifacts/throughline.tgz
          (cd release-artifacts && sha256sum throughline.tgz > SHA256SUMS)
          git rev-parse HEAD > release-artifacts/RELEASE_COMMIT
          echo "THL_RELEASE_TARBALL=$PWD/release-artifacts/throughline.tgz" >> "$GITHUB_ENV"

      - name: Verify exact archive in independent consumers
        run: |
          pnpm audit:pack
          pnpm audit:browser
          pnpm audit:frameworks
          pnpm audit:markdown-hosts

      # Intentionally fail closed until U29 supplies a reviewed production-only
      # packed audit; the dev preview and copied-adapter audit cannot satisfy this.
      - name: Require production Mermaid packed acceptance on every engine
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/audit-mermaid-production.mjs || { echo "U29 production packed audit is not implemented"; exit 1; }
          for browser in chromium firefox webkit; do
            THROUGHLINE_QA_BROWSER="$browser" node scripts/audit-mermaid-production.mjs
          done
      - name: Verify evidence and seal candidate manifest
        run: node scripts/release-candidate-gate.mjs prepare
      - name: Retain production acceptance evidence for review
        uses: actions/upload-artifact@v7
        with:
          name: throughline-production-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release-evidence/production-mermaid-*.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload immutable release review artifact
        uses: actions/upload-artifact@v7
        with:
          name: throughline-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-artifacts/throughline.tgz
            release-artifacts/SHA256SUMS
            release-artifacts/RELEASE_COMMIT
            release-artifacts/CANDIDATE.json
          if-no-files-found: error
          retention-days: 7

  authorize:
    name: Verify exact candidate and maintainer attestation
    if: github.ref == 'refs/heads/main' && inputs.mode == 'stage'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      archive_sha: ${{ steps.gate.outputs.archive_sha }}
    steps:
      - name: Require explicit staging request
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          CONFIRMATION: ${{ inputs.confirmation }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          CANDIDATE_ATTEMPT: ${{ inputs.candidate_attempt }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$CONFIRMATION" == "STAGE-$RELEASE_TAG" ]]
          [[ "$CANDIDATE_RUN" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
      - name: Checkout exact tag without persistent credentials
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify signed annotated tag on main using GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          [[ "$(jq -r '.object.type' <<< "$tag_ref")" == "tag" ]] || { echo "Signed annotated tag required"; exit 1; }
          tag_sha="$(jq -er '.object.sha' <<< "$tag_ref")"
          tag_data="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha")"
          [[ "$(jq -r '.tag' <<< "$tag_data")" == "$RELEASE_TAG" ]] || exit 1
          [[ "$(jq -r '.verification.verified' <<< "$tag_data")" == "true" ]] || { echo "Tag not GitHub Verified"; exit 1; }
          [[ "$(jq -r '.object.type' <<< "$tag_data")" == "commit" ]] || exit 1
          [[ "$(jq -r '.object.sha' <<< "$tag_data")" == "$(git rev-parse HEAD)" ]] || exit 1
          git fetch origin main --no-tags
          git merge-base --is-ancestor HEAD origin/main || { echo "Tagged commit is not on main"; exit 1; }
          git cat-file -e HEAD:.github/workflows/publish.yml

      - name: Verify tag is current dispatch source and prior prepare run succeeded
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          CANDIDATE_ATTEMPT: ${{ inputs.candidate_attempt }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          endpoint="repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN/attempts/$CANDIDATE_ATTEMPT"
          data="$(gh api "$endpoint")"
          jq -e --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" --arg attempt "$CANDIDATE_ATTEMPT" '
            .head_sha == $sha and .head_branch == "main" and .event == "workflow_dispatch" and
            .path == ".github/workflows/publish.yml" and .status == "completed" and .conclusion == "success" and
            .repository.full_name == $repo and (.run_attempt|tostring) == $attempt
          ' <<< "$data"
          gh api "$endpoint/jobs" --paginate --jq '.jobs[] | select(.name == "Prepare and test immutable release candidate" and .conclusion == "success") | .id' > /tmp/prepare-job
          test "$(wc -l < /tmp/prepare-job)" -eq 1
          echo "PREPARE_COMPLETED_AT=$(jq -er '.updated_at' <<< "$data")" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Download exact prior candidate archive
        uses: actions/download-artifact@v8
        with:
          name: throughline-release-${{ inputs.candidate_run }}-${{ inputs.candidate_attempt }}
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
          path: release-artifacts
      - name: Download production audit records from same prepare attempt
        uses: actions/download-artifact@v8
        with:
          name: throughline-production-evidence-${{ inputs.candidate_run }}-${{ inputs.candidate_attempt }}
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
          path: candidate-proof
      - name: Validate source, archive and explicit human evidence before protected approval
        id: gate
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          CANDIDATE_ATTEMPT: ${{ inputs.candidate_attempt }}
          REVIEW_JSON: ${{ inputs.review }}
        run: node scripts/release-candidate-gate.mjs authorize

  stage:
    name: Stage reviewed tarball using GitHub OIDC provenance
    needs: authorize
    if: needs.authorize.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - name: Checkout same release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Download previously authorized candidate archive
        uses: actions/download-artifact@v8
        with:
          name: throughline-release-${{ inputs.candidate_run }}-${{ inputs.candidate_attempt }}
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
          path: release-artifacts

      - name: Recheck checksum, release commit and archive manifest
        env:
          APPROVED_SHA256: ${{ needs.authorize.outputs.archive_sha }}
        shell: bash
        run: |
          set -euo pipefail
          (cd release-artifacts && sha256sum --check SHA256SUMS)
          [[ "$(sha256sum release-artifacts/throughline.tgz | cut -d ' ' -f1)" == "$APPROVED_SHA256" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(cat release-artifacts/RELEASE_COMMIT)" == "$(git rev-parse HEAD)" ]] || { echo "Tag changed since build"; exit 1; }
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { execFileSync } from "node:child_process";
          import { readFileSync } from "node:fs";
          const pkg = JSON.parse(execFileSync("tar", [
            "-xOf", "release-artifacts/throughline.tgz", "package/package.json"
          ], { encoding: "utf8" }));
          assert.equal(pkg.name, "@0xbuff/throughline");
          const source = JSON.parse(readFileSync("package.json", "utf8"));
          assert.equal(pkg.version, source.version, "Archive version must match signed tag source");
          assert.equal(pkg.private, false);
          assert.equal(pkg.publishConfig?.access, "public");
          assert.equal(pkg.license, "Apache-2.0");
          NODE

      # Avoid setup-node's registry-url input for tokenless OIDC:
      # it creates an .npmrc authToken placeholder and NODE_AUTH_TOKEN,
      # causing npm to attempt classic token authentication (E401).
      # The staging command itself explicitly selects registry.npmjs.org.
      - name: Set up Node 24 without token-based npm registry authentication
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install compatible npm CLI
        run: |
          npm install --global npm@11.21.2
          npm --version

      - name: Confirm tokenless OIDC authentication path
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]] || { echo "GitHub OIDC unavailable"; exit 1; }
          [[ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]] || { echo "GitHub OIDC token request unavailable"; exit 1; }
          [[ -z "${NODE_AUTH_TOKEN:-}" ]] || { echo "Unexpected traditional npm token; OIDC only"; exit 1; }
          userconfig="$(npm config get userconfig)"
          if [[ -f "$userconfig" ]] && grep -Eq '(^|/):_authToken[[:space:]]*=' "$userconfig"; then
            echo "An npm authToken entry would prevent tokenless OIDC"
            exit 1
          fi

      - name: Stage only with provenance (never direct-publish)
        shell: bash
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail
          npm stage publish ./release-artifacts/throughline.tgz --access public --provenance --registry=https://registry.npmjs.org/

      - name: State remaining npm manual approval
        shell: bash
        run: |
          {
            pkg_version="$(node -p "require('./package.json').version")"
            echo "### @0xbuff/throughline@${pkg_version} submitted to npm staging"
            echo "This is NOT a published version. Review the staged package and"
            echo "approve separately with npm 2FA on npmjs.com or through npm CLI."
            echo "Source: $(git rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"
