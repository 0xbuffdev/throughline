name: Throughline npm release (staged with provenance)

# Manual only: staging is not publication; final npm 2FA approval is separate.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "GitHub-verified signed release tag"
        type: string
        required: true
      confirmation:
        description: "Enter STAGE-<tag>, for example STAGE-v0.2.0"
        type: string
        required: true
      acceptance_comment_id:
        description: "Maintainer issue-comment ID proving real TL-U18 screen-reader acceptance against this source and exact tarball SHA"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: throughline-npm-stage
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag and build release archive
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Require explicit manual release request
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          CONFIRMATION: ${{ inputs.confirmation }}
          ACCEPTANCE_COMMENT_ID: ${{ inputs.acceptance_comment_id }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || exit 1
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Use a signed vX.Y.Z tag"; exit 1; }
          [[ "$CONFIRMATION" == "STAGE-$RELEASE_TAG" ]] || { echo "Type STAGE-$RELEASE_TAG to proceed"; exit 1; }
          [[ "$ACCEPTANCE_COMMENT_ID" =~ ^[1-9][0-9]{0,19}$ ]] || { echo "A real GitHub issue-comment ID is required for TL-U18 acceptance"; exit 1; }

      - name: Checkout exact tag without persistent credentials
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify signed annotated tag on main using GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          [[ "$(jq -r '.object.type' <<< "$tag_ref")" == "tag" ]] || { echo "Signed annotated tag required"; exit 1; }
          tag_sha="$(jq -er '.object.sha' <<< "$tag_ref")"
          tag_data="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha")"
          [[ "$(jq -r '.tag' <<< "$tag_data")" == "$RELEASE_TAG" ]] || exit 1
          [[ "$(jq -r '.verification.verified' <<< "$tag_data")" == "true" ]] || { echo "Tag not GitHub Verified"; exit 1; }
          [[ "$(jq -r '.object.type' <<< "$tag_data")" == "commit" ]] || exit 1
          [[ "$(jq -r '.object.sha' <<< "$tag_data")" == "$(git rev-parse HEAD)" ]] || exit 1
          git fetch origin main --no-tags
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]] || {
            echo "Stale tag: releases must be built from the currently reviewed main head"
            exit 1
          }
          git cat-file -e HEAD:.github/workflows/publish.yml

      - name: Bind release evidence to the exact checked-out signed tag commit
        shell: bash
        run: echo "THL_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6
        name: Set up pinned pnpm
      - uses: actions/setup-node@v6
        name: Set up Node 24 without release caching
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate package, version, license and export map
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          assert.equal(pkg.name, "@0xbuff/throughline");
          assert.match(pkg.version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/);
          assert.equal(process.env.RELEASE_TAG, `v${pkg.version}`, "Signed tag must match package version");
          assert.equal(pkg.private, false);
          assert.equal(pkg.publishConfig?.access, "public");
          assert.equal(pkg.license, "Apache-2.0");
          assert.equal(pkg.homepage, "https://docs.0xbuff.com/docs/throughline");
          assert.equal(pkg.repository?.url, "git+https://github.com/0xbuffdev/throughline.git");
          assert.deepEqual(Object.keys(pkg.exports).sort(),
            [".", "./remark", "./react", "./examples", "./node", "./styles/throughline.css"].sort());
          assert.equal(pkg.bin?.thl, "./dist/cli/main.js");
          NODE

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Refuse to reuse an already-published npm version
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const version = JSON.parse(readFileSync("package.json", "utf8")).version;
          const registryUrl = "https://registry.npmjs.org/@0xbuff%2fthroughline/" + version;
          const result = await fetch(registryUrl, { redirect: "error", signal: AbortSignal.timeout(25000) });
          if (result.status === 200) throw new Error("Refusing to restage published version " + version);
          assert.equal(result.status, 404, "Cannot confirm registry version is available");
          console.log("Published npm version is not registered: " + version +
            " (an existing unpublished stage may still produce E409)");
          NODE
      - name: Source and license boundary audit
        run: pnpm audit:source
      - name: Typecheck
        run: pnpm typecheck
      - name: Typecheck and bundle local playground
        run: |
          pnpm preview:typecheck
          pnpm preview:build
      - name: Offline release workflow and verification regression suite
        run: pnpm test:release-tooling
      - name: Compiler, release performance and hostile-input tests
        run: pnpm test:run
      - name: Verify exact-tag quality evidence
        run: node scripts/verify-release-evidence.mjs
      - name: Upload validated release-quality evidence separately from the staged package
        uses: actions/upload-artifact@v7
        with:
          name: throughline-quality-${{ github.run_id }}
          path: |
            .release-evidence/v2-performance.json
            .release-evidence/v2-security.json
          if-no-files-found: error
          retention-days: 30

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        run: pnpm test:browser:run
      - name: Record Chromium verification
        run: node scripts/record-browser-evidence.mjs chromium
      - name: Upload verified Chromium evidence separately from the staged package
        uses: actions/upload-artifact@v7
        with:
          name: throughline-release-chromium-${{ github.run_id }}
          path: .release-evidence/v2-browser-chromium.json
          if-no-files-found: error
          retention-days: 30
      - name: Build typed ESM distributable
        run: pnpm build
      - name: Verify installed dependency licenses
        run: pnpm audit:licenses
      - name: Verify packed Node, TypeScript and React SSR consumers
        run: pnpm audit:pack
      - name: Verify packed Vite/React browser hydration
        run: pnpm audit:browser

      - name: Verify framework integration consumers
        run: pnpm audit:frameworks
      - name: Verify Markdown host consumers
        run: pnpm audit:markdown-hosts

      - name: Pack reviewed tarball and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          pnpm pack --out release-artifacts/throughline.tgz
          (cd release-artifacts && sha256sum throughline.tgz > SHA256SUMS)
          git rev-parse HEAD > release-artifacts/RELEASE_COMMIT
          (cd release-artifacts && sha256sum --check SHA256SUMS)

      - name: Record immutable release manifest with source, tag and archive digest
        env:
          THL_RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/release-artifact.mjs create release-artifacts

      - name: Require human TL-U18 screen-reader acceptance for exact source and archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_COMMENT_ID: ${{ inputs.acceptance_comment_id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$ACCEPTANCE_COMMENT_ID" \
            > release-artifacts/review-comment.json
          node scripts/verify-release-approval.mjs \
            release-artifacts/RELEASE_MANIFEST.json \
            release-artifacts/review-comment.json "$ACCEPTANCE_COMMENT_ID"
          printf '%s\n' "$ACCEPTANCE_COMMENT_ID" > release-artifacts/ACCEPTANCE_COMMENT_ID
          rm release-artifacts/review-comment.json

      - name: Upload immutable release review artifact
        uses: actions/upload-artifact@v7
        with:
          name: throughline-release-${{ github.run_id }}
          path: |
            release-artifacts/throughline.tgz
            release-artifacts/SHA256SUMS
            release-artifacts/RELEASE_COMMIT
            release-artifacts/RELEASE_MANIFEST.json
            release-artifacts/ACCEPTANCE_COMMENT_ID
          if-no-files-found: error
          retention-days: 7

  stage:
    name: Stage reviewed tarball using GitHub OIDC provenance
    needs: verify
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout same release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: throughline-release-${{ github.run_id }}
          path: release-artifacts

      - name: Recheck checksum, release commit and archive manifest
        shell: bash
        env:
          THL_RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          (cd release-artifacts && sha256sum --check SHA256SUMS)
          export THL_SOURCE_SHA="$(git rev-parse HEAD)"
          node scripts/release-artifact.mjs verify release-artifacts
          [[ "$(cat release-artifacts/RELEASE_COMMIT)" == "$(git rev-parse HEAD)" ]] || { echo "Tag changed since build"; exit 1; }
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { execFileSync } from "node:child_process";
          import { readFileSync } from "node:fs";
          const pkg = JSON.parse(execFileSync("tar", [
            "-xOf", "release-artifacts/throughline.tgz", "package/package.json"
          ], { encoding: "utf8" }));
          assert.equal(pkg.name, "@0xbuff/throughline");
          const source = JSON.parse(readFileSync("package.json", "utf8"));
          assert.equal(pkg.version, source.version, "Archive version must match signed tag source");
          assert.equal(pkg.private, false);
          assert.equal(pkg.publishConfig?.access, "public");
          assert.equal(pkg.license, "Apache-2.0");
          NODE

      - name: Reverify live maintainer acceptance before protected staging
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMENT_ID: ${{ inputs.acceptance_comment_id }}
        run: |
          set -euo pipefail
          [[ "$(cat release-artifacts/ACCEPTANCE_COMMENT_ID)" == "$EXPECTED_COMMENT_ID" ]] || {
            echo "Maintainer acceptance changed between verification and staging"
            exit 1
          }
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$EXPECTED_COMMENT_ID" \
            > acceptance-comment.json
          node scripts/verify-release-approval.mjs \
            release-artifacts/RELEASE_MANIFEST.json \
            acceptance-comment.json "$EXPECTED_COMMENT_ID"
          rm acceptance-comment.json

      # Avoid setup-node's registry-url input for tokenless OIDC:
      # it creates an .npmrc authToken placeholder and NODE_AUTH_TOKEN,
      # causing npm to attempt classic token authentication (E401).
      # The staging command itself explicitly selects registry.npmjs.org.
      - name: Set up Node 24 without token-based npm registry authentication
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install compatible npm CLI
        run: |
          npm install --global npm@11.21.2
          npm --version

      - name: Confirm tokenless OIDC authentication path
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]] || { echo "GitHub OIDC unavailable"; exit 1; }
          [[ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]] || { echo "GitHub OIDC token request unavailable"; exit 1; }
          [[ -z "${NODE_AUTH_TOKEN:-}" ]] || { echo "Unexpected traditional npm token; OIDC only"; exit 1; }
          userconfig="$(npm config get userconfig)"
          if [[ -f "$userconfig" ]] && grep -Eq '(^|/):_authToken[[:space:]]*=' "$userconfig"; then
            echo "An npm authToken entry would prevent tokenless OIDC"
            exit 1
          fi

      - name: Stage only with provenance (never direct-publish)
        shell: bash
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail
          npm stage publish ./release-artifacts/throughline.tgz --access public --provenance --registry=https://registry.npmjs.org/

      - name: State remaining npm manual approval
        shell: bash
        run: |
          {
            pkg_version="$(node -p "require('./package.json').version")"
            echo "### @0xbuff/throughline@${pkg_version} submitted to npm staging"
            echo "This is NOT a published version. Review the staged package and"
            echo "approve separately with npm 2FA on npmjs.com or through npm CLI."
            echo "Source: $(git rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"
