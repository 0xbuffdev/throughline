name: Throughline Registration Candidate Preview

# Read-only verification: local npm pack only. No registry write or OIDC.
on:
  pull_request:
    paths:
      - ".github/workflows/registration-preview.yml"
      - "scripts/prepare-registration.mjs"
      - "REGISTRATION.md"
      - "COPYRIGHT.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v6
      - name: Use Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Pack safe nonfunctional candidate locally
        run: node scripts/prepare-registration.mjs
      - name: Upload preview for human review (never stage)
        uses: actions/upload-artifact@v7
        with:
          name: throughline-registration-preview-\${{ github.sha }}
          path: |
            registration-preview/*.tgz
            registration-preview/SHA256SUMS
            registration-preview/REGISTRATION_INFO.txt
          if-no-files-found: error
          retention-days: 7
