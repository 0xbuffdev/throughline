name: npm Public Registry Preflight

# Read-only HTTP GET. No publish commands, credentials, OIDC or environment writes.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/npm-registry-preflight.yml'
      - 'scripts/audit-registry.mjs'
      - 'RELEASING.md'

permissions:
  contents: read

jobs:
  registry:
    name: Inspect public package metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Query public npm registry
        run: node scripts/audit-registry.mjs
